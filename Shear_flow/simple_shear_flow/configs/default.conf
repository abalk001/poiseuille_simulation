# Simple Shear Flow Configuration - Default Parameters
# Based on Coupier et al. (2009)
# All distances in micrometers (um)

# Vesicle properties
VESICLE_RADIUS = 10.0    # Effective radius (um)
LAMBDA = 1.0             # Viscosity ratio (inner/outer)
NU = 0.95                # Reduced volume (1=sphere, <1=deflated)

# Flow properties
CHANNEL_WIDTH = 140.0    # Channel width (um)
SHEAR_RATE = 10.0        # Shear rate (s^-1)

# Simulation parameters
DT = 0.01                # Time step (s)
TOTAL_TIME = 30.0        # Total simulation time (s)
