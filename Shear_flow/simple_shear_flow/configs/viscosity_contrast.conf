# High Viscosity Contrast Configuration
# Tests effect of viscosity ratio on migration
# From Coupier et al. (2009) - Figure 4

# Vesicle properties
VESICLE_RADIUS = 12.0    # Medium size vesicle (um)
LAMBDA = 5.0             # Inner fluid 5x more viscous
NU = 0.90                # Moderately deflated

# Flow properties
CHANNEL_WIDTH = 140.0    # Standard channel (um)
SHEAR_RATE = 15.0        # Higher shear rate (s^-1)

# Simulation parameters
DT = 0.005               # Smaller time step for stability
TOTAL_TIME = 40.0        # Simulation time (s)
