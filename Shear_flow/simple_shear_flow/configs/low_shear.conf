# Low Shear Rate Configuration
# Tests migration at lower flow rates
# From Coupier et al. (2009) experimental conditions

# Vesicle properties
VESICLE_RADIUS = 10.0    # Standard vesicle (um)
LAMBDA = 1.0             # Equal viscosities
NU = 0.95                # Nearly spherical

# Flow properties
CHANNEL_WIDTH = 140.0    # Standard channel (um)
SHEAR_RATE = 2.0         # Low shear rate (s^-1)

# Simulation parameters
DT = 0.02                # Larger time step (slower dynamics)
TOTAL_TIME = 60.0        # Longer time to see migration (s)
