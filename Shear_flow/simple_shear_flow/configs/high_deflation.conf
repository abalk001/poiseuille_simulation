# High Deflation Configuration
# Tests effect of strong vesicle deflation on migration
# From Coupier et al. (2009) - Figure 2

# Vesicle properties
VESICLE_RADIUS = 15.0    # Larger vesicle (um)
LAMBDA = 1.0             # Equal viscosities
NU = 0.75                # Strongly deflated vesicle

# Flow properties
CHANNEL_WIDTH = 200.0    # Wider channel from paper (um)
SHEAR_RATE = 10.0        # Standard shear rate (s^-1)

# Simulation parameters
DT = 0.01                # Time step (s)
TOTAL_TIME = 50.0        # Longer observation time (s)
