# Configuration matching Paper Figure 2
# Coupier et al. (2009) - Effect of deflation
# Lambda = 1, varying nu

# Vesicle properties
VESICLE_RADIUS = 15.0    # R0 ~ 15 um from paper
LAMBDA = 1.0             # Equal viscosities (lambda = 1)
NU = 0.80                # Deflation nu = 0.80

# Flow properties
CHANNEL_WIDTH = 170.0    # W = 170 um from paper
SHEAR_RATE = 10.0        # gamma ~ 10 s^-1

# Simulation parameters
DT = 0.01                # Standard time step
TOTAL_TIME = 30.0        # Observation time (s)
